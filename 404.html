<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Strona nie znaleziona — Loud Nearby</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg: #131214; --text: #EDE9E3; --text-dim: #A29CA0; --accent: #E4415C; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 480px; }
  img { width: 140px; height: auto; margin-bottom: 24px; }
  h1 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900; font-size: 40px; margin: 0 0 12px; color: var(--accent);
    text-transform: uppercase;
  }
  p { color: var(--text-dim); font-size: 16px; line-height: 1.5; margin: 0 0 28px; }
  a.home-btn {
    display: inline-block; padding: 12px 28px; border-radius: 8px;
    background: var(--accent); color: #1A0A0D; text-decoration: none;
    font-weight: 600; font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase; letter-spacing: .04em; font-size: 13px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="logo-dark.png" alt="Loud Nearby">
    <h1>404 — cisza na sali</h1>
    <p>Tej strony nie ma w repertuarze. Sprawdź adres albo wróć do pełnej listy koncertów.</p>
    <a class="home-btn" href="/">Wróć na stronę główną</a>
  </div>
</body>
</html>
